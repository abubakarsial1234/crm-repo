<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#0f172a] text-slate-200 flex min-h-screen items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#1e293b] p-8 rounded-2xl shadow-xl border border-slate-700/50">
        <h2 class="text-3xl font-bold text-center text-emerald-400 mb-2">Welcome Back</h2>
        <p class="text-slate-400 text-center text-sm mb-6">Apne credentials ke sath CRM portal login karein</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 mb-4 rounded-lg text-sm {% if category == 'danger' %} bg-red-500/20 text-red-400 border border-red-500/30 {% else %} bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
                <input type="email" name="email" required class="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                <input type="password" name="password" required class="w-full bg-[#0f172a] border border-slate-700 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500 transition-colors">
            </div>

            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-[#0f172a] font-bold py-3 rounded-lg shadow-lg shadow-emerald-500/20 cursor-pointer transition-all mt-2">
                Sign In
            </button>
        </form>

        <p class="text-center text-slate-400 text-sm mt-6">
            Naya account banana hai? <a href="/signup" class="text-emerald-400 hover:underline">Yahan Signup karein</a>
        </p>
    </div>

</body>
</html>
