<div class="mt-10">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Recent Leads</h2>
            <div class="bg-white shadow-md rounded my-6 overflow-x-auto">
                <table class="min-w-full table-auto">
                    <thead>
                        <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                            <th class="py-3 px-6 text-left">ID</th>
                            <th class="py-3 px-6 text-left">Name</th>
                            <th class="py-3 px-6 text-left">Email</th>
                            <th class="py-3 px-6 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-600 text-sm font-light">
                        
                        {% for lead in leads %}
                        <tr class="border-b border-gray-200 hover:bg-gray-100">
                            <td class="py-3 px-6 text-left font-bold">{{ lead.id }}</td>
                            <td class="py-3 px-6 text-left">{{ lead.name }}</td>
                            <td class="py-3 px-6 text-left">{{ lead.email }}</td>
                            <td class="py-3 px-6 text-center">
                                <span class="bg-blue-100 text-blue-700 py-1 px-3 rounded-full text-xs">{{ lead.status }}</span>
                            </td>
                        </tr>
                        {% endfor %}
                        </tbody>
                </table>
            </div>
        </div>
